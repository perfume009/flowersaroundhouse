<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>flowersaroundhouse — game dev</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e0a17;--ink2:#171124;--line:#2b2142;--text:#f1ebff;--dim:#9d93b8;--pink:#ff6fae;--gold:#ffd96a;--violet:#8b6cff;--d:'Unbounded','Onest',system-ui,sans-serif;--b:'Onest',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(80px + env(safe-area-inset-top,0px));scroll-behavior:smooth;background:var(--ink)}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font:400 17px/1.65 var(--b);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.06;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
a{color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
button{font:inherit;cursor:pointer}
nav{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:2px;padding:6px;border:1px solid var(--line);border-radius:99px;background:#171124b8;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:drop .9s 1s both cubic-bezier(.2,.8,.2,1)}
nav a{color:var(--dim);text-decoration:none;font-size:14px;padding:7px 15px;border-radius:99px;transition:.25s;white-space:nowrap}
nav a:hover{color:var(--text);background:#ffffff14}
.lg{display:flex;margin-left:6px;padding-left:6px;border-left:1px solid var(--line)}.lg button{border:0;background:none;color:var(--dim);font-size:13px;font-weight:500;padding:7px 11px;border-radius:99px;transition:.25s}.lg button:hover{color:var(--text)}.lg button.on{background:var(--text);color:var(--ink)}
nav .logo{color:var(--pink);font-size:18px;padding:5px 12px}
@keyframes drop{from{opacity:0;translate:0 -24px}}
.hero{position:relative;min-height:100svh;overflow:hidden;display:flex;align-items:center}
#bloom{width:100%;max-width:440px;height:auto;aspect-ratio:26/36;justify-self:center;image-rendering:pixelated;filter:drop-shadow(0 0 48px #ff6fae40)}
.hin{position:relative;width:100%;max-width:1400px;margin:0 auto;padding:110px 32px 56px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center}
h1{font:700 clamp(46px,8vw,124px)/.98 var(--d);letter-spacing:-.03em;margin:0 0 30px;text-shadow:0 2px 40px #0e0a17b0}
h1 .w{display:block;overflow:hidden;padding:0 .1em .07em;margin-left:-.1em}h1 .w:nth-child(2) i{margin-left:-.012em}h1 .w:nth-child(3) i{margin-left:-.03em}
h1 .w i{display:block;font-style:normal;transform:translateY(112%);animation:up 1.2s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.16s*var(--i) + .25s)}
@keyframes up{to{transform:none}}
.role{display:flex;align-items:center;gap:14px;margin:0 0 30px;font:500 clamp(18px,2.4vw,26px)/1.3 var(--b);animation:fade 1s 1.1s both}
.role::before{content:"";width:34px;height:2px;background:var(--pink);flex:none}
#role{display:inline-block;transition:opacity .45s,translate .45s}#role.out{opacity:0;translate:0 -10px}
.cta{display:flex;gap:12px;flex-wrap:wrap;animation:fade 1s 1.3s both}
@keyframes fade{from{opacity:0;translate:0 16px}}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:99px;border:1px solid var(--line);background:#171124aa;color:var(--text);text-decoration:none;font-weight:500;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s,color .3s}
.btn:hover{transform:translateY(-3px);border-color:var(--text)}
.btn.p{background:var(--pink);border-color:var(--pink);color:var(--ink)}
.btn.p:hover{background:var(--gold);border-color:var(--gold)}
section{max-width:1240px;margin:0 auto;padding:120px 24px 0}
h2{font:700 clamp(34px,6vw,76px)/1.05 var(--d);letter-spacing:-.025em;margin:0 0 40px}
.rv{opacity:0;translate:0 26px;transition:opacity .8s ease,translate .9s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;translate:none}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:30px}
.tools input{flex:1 1 220px;max-width:340px;padding:11px 20px;border-radius:99px;border:1px solid var(--line);background:var(--ink2);color:var(--text);font:inherit;font-size:15px;outline:none;transition:border-color .2s}
.tools input:focus{border-color:var(--pink)}
.chip{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--dim);font-size:14px;transition:.25s;margin:0 4px 0 0}
.chip:hover{color:var(--text);border-color:var(--dim)}.chip.on{background:var(--text);border-color:var(--text);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:22px}
.card{position:relative;border-radius:28px;background:var(--ink2);border:1px solid var(--line);overflow:hidden;cursor:pointer;opacity:0;translate:0 30px;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:opacity .7s ease var(--dl,0s),translate .8s cubic-bezier(.2,.8,.2,1) var(--dl,0s),transform .3s ease-out,border-color .3s}
.card.in{opacity:1;translate:none}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%),#ffffff16,transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::after,.card:focus-visible::after{opacity:1}
.card:hover,.card:focus-visible{border-color:hsl(var(--h) 70% 62%)}
.cover{aspect-ratio:16/10;display:grid;place-items:center;background:radial-gradient(circle at 50% 125%,hsl(var(--h) 70% 40%),hsl(var(--h) 45% 13%) 72%)}
.cover canvas{height:64%;aspect-ratio:1;image-rendering:pixelated;filter:drop-shadow(0 14px 22px #0009);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.card:hover canvas{transform:scale(1.14) rotate(-5deg)}
.cover{position:relative;overflow:hidden}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.8,.2,1)}.card:hover .cover img{transform:scale(1.06)}
.bd{padding:20px 24px 24px}
.card h3{font:600 21px/1.2 var(--d);letter-spacing:-.01em;margin:0 0 8px}
.meta{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14px;margin-bottom:10px}
.meta .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.card p{margin:0 0 14px;color:#cfc6e6;font-size:16px;line-height:1.5}
.tags span{display:inline-block;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:2px 12px;margin:0 6px 6px 0;color:var(--dim)}
.empty{color:var(--dim);grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);margin-top:56px}
.stat{padding:28px 20px 6px 0}
.stat b{display:block;font:700 clamp(42px,7vw,92px)/1 var(--d);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{color:var(--dim);font-size:15px}
.big{font:500 clamp(22px,3.3vw,38px)/1.35 var(--b);max-width:34ch;margin:0}
.marq{overflow:hidden;margin-top:90px;border-block:1px solid var(--line);padding:24px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;width:max-content;animation:mq 34s linear infinite}
.marq:hover .track{animation-play-state:paused}
.track span{display:flex;align-items:center;gap:48px;padding-right:48px;font:700 clamp(30px,5vw,60px) var(--d);color:transparent;-webkit-text-stroke:1px #f1ebff77;white-space:nowrap;transition:color .3s}
.track span:hover{color:var(--text)}
.track span::after{content:"✿";color:var(--pink);-webkit-text-stroke:0;font-size:.55em}
@keyframes mq{to{transform:translateX(-50%)}}
.log{margin-top:90px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(96px,220px) 1fr;gap:24px;padding:30px 0;border-bottom:1px solid var(--line);transition:padding .45s cubic-bezier(.2,.8,.2,1)}
.row:hover{padding-left:16px}
.row b{font:700 clamp(26px,4vw,48px)/1 var(--d);color:var(--pink)}
.row p{margin:0;font-size:clamp(17px,2vw,21px);max-width:46ch;align-self:center}
.links a{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:30px 0;border-top:1px solid var(--line);text-decoration:none;font:700 clamp(30px,6.4vw,76px)/1 var(--d);letter-spacing:-.025em;transition:padding .45s cubic-bezier(.2,.8,.2,1),color .3s}
.links a:last-child{border-bottom:1px solid var(--line)}
.links a:hover{padding-left:22px;color:var(--pink)}
.links svg{width:.7em;height:.7em;flex:none;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.links a:hover svg{transform:translate(8px,-8px)}
footer{max-width:1240px;margin:0 auto;padding:80px 24px 56px;color:var(--dim);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:#07040dcf;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
#modal.on{opacity:1;visibility:visible}
#mb{position:relative;width:min(560px,100%);max-height:90svh;overflow-y:auto;border-radius:32px;background:var(--ink2);border:1px solid var(--line);transform:translateY(34px) scale(.94);transition:transform .55s cubic-bezier(.2,.9,.2,1)}
#modal.on #mb{transform:none}
#mb .cover{aspect-ratio:16/9}
#mb .bd{padding:24px 28px 28px}
#mb p{margin:0 0 16px;color:#cfc6e6}
#mx{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid #ffffff30;background:#0e0a1799;color:var(--text);font-size:18px;line-height:1;transition:.25s}
#mx:hover{background:var(--text);color:var(--ink);transform:rotate(90deg)}
@media (max-width:640px){nav a{padding:7px 8px}.lg{margin-left:2px;padding-left:2px}.lg button{padding:7px 8px}.row{grid-template-columns:1fr;gap:6px}.hin{grid-template-columns:1fr;padding-inline:24px}.txt{position:relative;z-index:1}h1{font-size:clamp(46px,15vw,100px)}#bloom{position:absolute;z-index:0;right:-6vw;top:50%;width:min(70vw,300px);transform:translateY(-50%);opacity:.5;pointer-events:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}h1 .w i{transform:none}.rv,.card{opacity:1;translate:none}}
</style>
</head>

<header class="hero" id="top">
<div class="hin">
<div class="txt">

<p class="role"><span id="role"></span></p>
<div class="cta"><a class="btn p" href="#games" data-i="cta1">Смотреть игры</a><a class="btn" href="#contact" data-i="cta2">Связаться</a></div>

</div>
</header>

<section id="games">

<div class="tools rv"><input id="q" type="search" placeholder="Поиск по названию" aria-label="Поиск"></div>
<div class="grid" id="grid"></div>
</section>

<section id="about">
<h2 class="rv" data-i="n_about">Обо мне</h2>
<p class="big rv" data-i="bio">Делаю игры сам: от идеи и геймплея до релиза.</p>

<section id="contact">
<h2 class="rv" data-i="n_contact">Контакты</h2>
<div class="links rv" id="links"></div>
</section>

<footer><span>© <span id="y"></span> flowersaroundhouse</span><span data-i="foot">Сделано с ✿ и кофе</span></footer>

 $("grid").innerHTML=list.length?list.map(function(g,k){return '<article class="card" tabindex="0" role="button" data-i="'+GAMES.indexOf(g)+'" style="--h:'+hueOf(g.n)+';--c:'+(SC[g.st]||"#9d93b8")+';--dl:'+k*90+'ms"><div class="cover">'+(g.img?'<img src="'+esc(g.img)+'" alt="'+esc(g.n)+'" loading="lazy">':'<canvas data-n="'+esc(g.n)+'"></canvas>')+'</div><div class="bd"><h3>'+esc(g.n)+'</h3><div class="meta"><i class="dot"></i><span>'+esc(T[L].st[g.st]||g.st)+'</span><span>'+g.y+'</span></div><p>'+esc(g.d[L])+'</p><div class="tags">'+tagsH(g)+'</div></div></article>'}).join(""):'<p class="empty">'+tr("none")+'</p>';
 document.querySelectorAll("canvas[data-n]").forEach(function(c){sprite(c,c.dataset.n)});
 document.querySelectorAll(".card").forEach(function(c){io.observe(c);
  c.onclick=function(){openG(+c.dataset.i)};
  c.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();openG(+c.dataset.i)}};
  c.onpointermove=function(e){if(e.pointerType!=="mouse")return;var b=c.getBoundingClientRect(),px=(e.clientX-b.left)/b.width,py=(e.clientY-b.top)/b.height;
   c.style.setProperty("--ry",(px-.5)*8+"deg");c.style.setProperty("--rx",-(py-.5)*8+"deg");c.style.setProperty("--mx",px*b.width+"px");c.style.setProperty("--my",py*b.height+"px")};
  c.onpointerleave=function(){c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")}})}
$("q").oninput=draw;draw();

// modal
var lastF=null,curG=null;
function openG(i){lastF=document.activeElement;fillM(i)}
function fillM(i){var g=GAMES[i];curG=i;
 $("mb").innerHTML='<div class="cover" style="--h:'+hueOf(g.n)+'">'+(g.img?'<img src="'+esc(g.img)+'" alt="'+esc(g.n)+'">':'<canvas id="mc"></canvas>')+'</div><button id="mx" aria-label="'+tr("close")+'">✕</button><div class="bd"><h3 style="font:600 24px/1.2 var(--d);margin:0 0 8px">'+esc(g.n)+'</h3><div class="meta" style="--c:'+(SC[g.st]||"#9d93b8")+'"><i class="dot"></i><span>'+esc(T[L].st[g.st]||g.st)+'</span><span>'+g.y+'</span></div><p>'+esc(g.l[L])+'</p><div class="tags" style="margin-bottom:18px">'+tagsH(g)+'</div><a class="btn p" href="'+esc(g.url)+'" target="_blank" rel="noopener">'+tr("play")+'</a></div>';
 if($("mc"))sprite($("mc"),g.n);$("modal").classList.add("on");$("mx").onclick=closeM;$("mx").focus()}
function closeM(){curG=null;$("modal").classList.remove("on");if(lastF)lastF.focus()}
$("modal").onclick=function(e){if(e.target===$("modal"))closeM()};
addEventListener("keydown",function(e){if(e.key==="Escape")closeM()});

// static blocks
var st=STACK.map(function(s){return '<span>'+esc(s)+'</span>'}).join("");$("stack").innerHTML=st+st;
function renderLog(){$("log").innerHTML=LOG.map(function(l){return '<div class="row"><b>'+esc(l[0])+'</b><p>'+esc(l[L==="en"?2:1])+'</p></div>'}).join("")}renderLog();
$("links").innerHTML=LINKS.map(function(l){return '<a href="'+esc(l[1])+'" target="_blank" rel="noopener"><span>'+esc(l[0])+'</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a>'}).join("");
$("y").textContent=new Date().getFullYear();

// rotating role
var ri=0,ro=$("role");ro.textContent=ROLES[L][0];
setInterval(function(){ro.classList.add("out");setTimeout(function(){ri=(ri+1)%ROLES[L].length;ro.textContent=ROLES[L][ri];ro.classList.remove("out")},450)},3400);

// language switch
function setLang(l){L=l;try{localStorage.setItem("lang",l)}catch(e){}
 document.documentElement.lang=l;
 document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=tr(e.dataset.i)});
 document.querySelectorAll("[data-ia]").forEach(function(e){e.setAttribute("aria-label",tr(e.dataset.ia))});
 $("q").placeholder=tr("ph");$("q").setAttribute("aria-label",tr("ph"));
 document.querySelectorAll(".lg button").forEach(function(b){b.classList.toggle("on",b.dataset.l===l)});
 var n=GAMES.length;$("gl").textContent=l==="en"?(n===1?"game":"games"):(n%10===1&&n%100!==11?"игра":"игр");
 renderLog();draw();ri=0;ro.textContent=ROLES[l][0];if(curG!==null)fillM(curG)}
document.querySelectorAll(".lg button").forEach(function(b){b.onclick=function(){setLang(b.dataset.l)}});
setLang(L);

// hero: pixel flower that grows on load, sways and leans toward the cursor
(function(){var c=$("bloom"),x=c.getContext("2d"),W=26,H=36,cx=13,cy=11,cell=8,t0=performance.now(),tx=0,mx=0,vis=true,px=[],r=rng("flower"),
 rm=matchMedia("(prefers-reduced-motion:reduce)").matches,
 C={a:"#ffb3d6",b:"#ff6fae",c:"#c93d82",v1:"#a58cff",v2:"#6a4bd8",v3:"#4a32a3",g:"#ffd96a",o:"#ff9a3c",l1:"#7df0b0",l2:"#2fb57a",l3:"#1d7f58",s:"#2a2140"};
 function put(X,Y,col,d){if(X>=0&&X<W&&Y>=0&&Y<H)px[Y*W+X]={x:X,y:Y,c:col,d:d}}
 function hd(X,Y){return Math.hypot(X+.5-cx,Y+.5-cy)}
 function petals(n,off,dist,rad,col){for(var k=0;k<n;k++){var a=off+k*Math.PI*2/n,pcx=cx+Math.cos(a)*dist,pcy=cy+Math.sin(a)*dist;
  for(var Y=0;Y<H;Y++)for(var X=0;X<W;X++){var dx=X+.5-pcx,dy=Y+.5-pcy;
   if(dx*dx+dy*dy<=rad*rad){var l=(-dx-dy)/rad;put(X,Y,l>.35?col[0]:l<-.45?col[2]:col[1],1.7+hd(X,Y)*.09)}}}}
 function leaf(lx,ly,rx,ry,ang){for(var Y=0;Y<H;Y++)for(var X=0;X<W;X++){var dx=X+.5-lx,dy=Y+.5-ly,u=dx*Math.cos(ang)+dy*Math.sin(ang),v=-dx*Math.sin(ang)+dy*Math.cos(ang);
  if(u*u/(rx*rx)+v*v/(ry*ry)<=1)put(X,Y,v<-.4?C.l1:v>.5?C.l3:C.l2,(33-Y)/14*1.5+.1)}}
 for(var Y=19;Y<=33;Y++){var dl=(33-Y)/14*1.5;put(12,Y,C.l2,dl);put(13,Y,C.l1,dl)}
 leaf(8.7,27.2,4.4,1.8,.46);leaf(17.3,24.2,4.4,1.8,-.46);
 petals(8,Math.PI/8,5.2,3.2,[C.v1,C.v2,C.v3]);
 petals(8,0,5.4,3.3,[C.a,C.b,C.c]);
 for(var Y=0;Y<H;Y++)for(var X=0;X<W;X++){var d=hd(X,Y);if(d<=3.4)put(X,Y,d>2.5||(d<2.5&&r()>.72)?C.o:C.g,1.7+d*.09)}
 for(var X=0;X<W;X++){var e=Math.abs(X-13)*.03;put(X,33,X%3?C.l3:C.l2,e);put(X,34,C.s,e);put(X,35,C.s,e);if(r()>.6)put(X,32,C.l3,e)}
 var fp=[];for(var i=0;i<7;i++)fp.push({bx:cx+(r()-.5)*12,y:4+r()*26,s:1.2+r()*1.2,p:r()*6,k:i%2?C.a:C.b});
 function rz(){var dpr=Math.min(devicePixelRatio||1,2);cell=Math.max(1,Math.floor(c.clientWidth*dpr/W));c.width=W*cell;c.height=H*cell}
 rz();addEventListener("resize",rz);
 addEventListener("pointermove",function(e){tx=e.clientX/innerWidth-.5});
 new IntersectionObserver(function(e){vis=e[0].isIntersecting}).observe(c);
 var last=performance.now();
 function f(now){requestAnimationFrame(f);if(!vis)return;
  var t=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;mx+=(tx-mx)*.05;
  x.clearRect(0,0,c.width,c.height);
  var sw=rm?0:Math.sin(t*1.1)*1.2+mx*3;
  for(var i=0;i<px.length;i++){var q=px[i];if(!q)continue;
   var g=rm?1:Math.min(1,(t-.3-q.d)*7);if(g<=0)continue;
   var h=Math.max(0,(33-q.y)/31),off=Math.round(sw*h*h*1.1),s=cell*g,o=(cell-s)/2;
   x.fillStyle=q.c;x.fillRect((q.x+off)*cell+o,q.y*cell+o,s,s)}
  if(!rm&&t>3.6)fp.forEach(function(p){p.y+=p.s*dt;if(p.y>32){p.y=3+Math.random()*6;p.bx=cx+(Math.random()-.5)*12}
   var X=Math.round(p.bx+Math.sin(t*1.3+p.p)*2.5);x.fillStyle=p.k;x.fillRect(X*cell,Math.round(p.y)*cell,cell,cell)})}
 requestAnimationFrame(f)})();
</script>
</body>
